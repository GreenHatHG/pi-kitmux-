[project]
name = "pi-kitmux"
version = "0.1.0"
description = "switch-pi-agent: pick a running Pi Coding Agent with fzf and jump to its Kitty tab / Byobu pane"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pre-commit>=3.0.0",
  "pylint>=4.0.6",
  "pyright>=1.1.411",
]

[tool.uv]
# Single-file script tools with no package layout; uv installs dev deps only, no build/install of the project
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.14"
files = ["."]
warn_unreachable = true
exclude = '(^\.venv/|^\.git/|^\.mypy_cache/|^\.ruff_cache/|^\.pre-commit-cache/|^\.tmp/)'

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "C90",
  "E4",
  "E7",
  "E9",
  "F",
  "SIM",
]
ignore = [
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.mccabe]
# collect_agents / main in switch-pi-agent are existing branchy dispatch logic (complexity 13); leave the script body alone
max-complexity = 15

[tool.vulture]
paths = ["."]
exclude = [
  "*/.venv/*",
  "*/.pre-commit-cache/*",
  "*/.tmp/*",
  "*/.mypy_cache/*",
  "*/.ruff_cache/*",
]
min_confidence = 60
sort_by_size = true
