# macOS-only tmux bits, sourced from tmux.conf's trailing `if-shell` on Darwin only.
# The main tmux.conf stays identical on every machine (Mac / VPS); anything that cannot
# work on Linux lives here, so the platform split is one small file per OS.

# macOS: open the pane's folder in VS Code (Linux VPS has no `open`)
bind-key v run-shell "open -a 'Visual Studio Code' '#{pane_current_path}'"
