# Linux-only tmux bits, sourced from tmux.conf's trailing `if-shell` on Linux only.
# The main tmux.conf stays identical on every machine (Mac / VPS); anything that cannot
# work on macOS lives here, so the platform split is one small file per OS.

# Let OSC 52 clipboard sequences from apps (e.g. pi's /copy over SSH) reach the
# local terminal; without this tmux swallows them and the Mac clipboard never gets it.
set -g set-clipboard on

# macOS counterpart lives in tmux.darwin.conf (`open -a`).
# Try the SSH RemoteForward tunnel first (Mac listener opens a Remote window);
# if the tunnel is down the helper falls back to OSC 52 (URL to the Mac clipboard)
# and prints WHY it fell back to stderr.
bind-key v run-shell -b "$HOME/.local/bin/tmux-open-vscode.py '#{pane_current_path}'"
