set -g prefix ^B
set-window-option -g xterm-keys on
unbind-key -n C-a
unbind-key -n M-Left
unbind-key -n M-Right
unbind-key -n M-Up
unbind-key -n M-Down

set -g set-titles on

# Platform-specific bits live in tmux.darwin.conf (macOS only: `open -a` etc.) and
# tmux.linux.conf (Linux only: bind v via the SSH tunnel + OSC 52 fallback).
# One source of truth on both machines (Mac / VPS): shared config here, per-OS extras
# loaded at the end so the generic file stays identical everywhere.
if-shell 'uname -s | grep -q Darwin' 'source -q "$HOME/.tmux.darwin.conf"'
if-shell 'uname -s | grep -qv Darwin' 'source -q "$HOME/.tmux.linux.conf"'

# Call it once and store @pi_loc: a repeated #(command) in one format string runs only
# once in tmux, and @pi_repo / @pi_where are sliced from that one result, no extra git fork.
# #{q:pane_current_path} shell-quotes the path, so the helper gets it whole even with spaces.
# @pi_loc: pi-kitmux/main, pi-kitmux/wt:5; empty if non git folder
set -g @pi_loc "#($HOME/.local/bin/tmux-pane-repo.py #{q:pane_current_path})"

# E: as telling tmux: 'Don’t just read this as raw text, actually execute and unpack it first!'
# Project name: the part before the first /; all worktrees of one repo share it, keeping the kitty title stable
# @pi_repo: pi-kitmux; empty if non git folder
set -g @pi_repo "#{s|/.*||:#{E:@pi_loc}}"

# swap the whole "project/" for @; an empty string stays empty
# @pi_where: @main
set -g @pi_where "#{s|.*/|@|:#{E:@pi_loc}}"

# set -g set-titles-string "#{pane_current_command}: #{b:pane_current_path}"
# Outside git there is no @pi_repo, so the title falls back to the cwd basename (no place suffix)
# The cross-machine identity tag: the remote title syncs to the Mac kitty tab,
# and the bind p picker decodes it there to map a tmux session to its kitty tab —
# pids cannot be compared across machines, the title is the only channel that crosses.
# The tag (host:session) is encoded as ZERO-WIDTH chars by tmux-title-tag.py: kitty
# renders nothing, so the tab always shows the clean "⏳N repo"; kitty ls's raw title
# keeps the bits, and the picker decodes them. host comes from the machine itself.
set -g set-titles-string "#{@pi_total}#{?#{E:@pi_repo},#{E:@pi_repo},#{b:pane_current_path}}#($HOME/.local/bin/tmux-title-tag.py '#S')"

set -g extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1

# set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"

set -as terminal-features ",xterm-kitty:RGB:usstyle"
set -ga terminal-overrides ",xterm-kitty:Tc"

set-environment -g COLORTERM "truecolor"
set -g allow-passthrough on

set -s extended-keys on
set -g mouse on
set -g history-limit 50000
set-window-option -g alternate-screen on

bind-key -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 2 scroll-down

bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

# Live in tmux.darwin.conf (macOS only): `open -a` does not exist on Linux.

unbind-key p
# NOTE: kitty remote control on the VPS needs the Mac side to opt in:
#   kitty.conf -> allow_remote_control socket-only
# Then kitten ssh forwards a remote-control socket and sets KITTY_LISTEN_ON in the
# remote login shell (tmux servers started from it inherit it). The picker also
# reads a persisted copy (~/.cache/kitty-listen-on) as a fallback, so an old tmux
# server without the var still works.
bind-key p display-popup -w 85% -h 60% -E "python3 ~/.local/bin/switch-pi-agent.py"

# set -g status-left-length 40
# Show the switch hint only with a few windows; many windows give the room to the tab bar
# set -g status-left "[#S]#[fg=cyan]#{?#{e|>:#{session_windows},3},, [C-b 0-9:switch tab]}#[default] "

# byobu bottom tab bar UI:
# - Each tab is its own "pill": grey for others, bold blue for the current one, dark │ between tabs
# - Each tab shows this window's Pi state: ⏳ running / ✅ done-unseen (no number)
# - Show the window number only when the session has more than one window (no "1:" for a single tab)
# - Cut the foreground command to 18 columns so a long command can't blow up the bar; in pane
#   modes like copy-mode still show the window name
# - Keep only the Pi state marker (@pi_win: ⏳ running / ✅ done-unseen), drop the native bell
#   ◉ and activity ● dots: ◉ duplicates ✅, and ● is almost always on for a busy agent, pure noise
# - Clearing "done" relies on the after-select-* hooks (see the end): switching to the window counts as seen
# - enclave is only a sandbox wrapper, and shebang scripts (pi is a node
#   script) show the interpreter's kernel name: the bar pulls the real app
#   name from the foreground leader's full command line in both cases
# - Labels are all "name@place": place comes from @pi_where (worktree is wt:<name>, main repo is
#   main, outside git it is empty), e.g. pi@main / pi@wt:5
# - The tab body is factored into @pi_win_fmt, shared by the normal and current lines, so there
#   is no hand-copied second version to drift
set -g window-status-style "bg=colour236,fg=colour250"
set -g window-status-current-style "bg=colour24,fg=colour231,bold"
set -g window-status-bell-style default
set -g window-status-activity-style default
# The separator must clear the background, or it inherits window-status-style's grey and joins the pills into one band
set -g window-status-separator "#[bg=default,fg=colour240]│"

set -g @pi_win_fmt "#{?pane_in_mode,#W,#{?#{|:#{e|==:#{pane_current_command},enclave},#{e|==:#{pane_current_command},node}},#($HOME/.local/bin/tmux-pane-command.py #{pane_pid} #{pane_current_command})#{E:@pi_where},#{=/18/…:#{pane_current_command}}#{E:@pi_where}}}"
set -g window-status-format " #{?#{e|>:#{session_windows},1},#I: ,}#{?#{@pi_win},#[fg=yellow]#{@pi_win},}#[default]#{E:@pi_win_fmt} "
set -g window-status-current-format " #{?#{e|>:#{session_windows},1},#I: ,}#{?#{@pi_win},#[fg=yellow]#{@pi_win},}#[default]#{E:@pi_win_fmt} "

# Switching to a window / pane counts as seen: clear that window's ✅ (done-unseen) and
# recompute @pi_win / @pi_total at once (otherwise it waits for the next Pi event, and an
# idle agent never sends one).
# All three are hooked because the triggers differ: when the current window is killed and
# focus lands on the next one, only session-window-changed fires (after-select-window does
# not) — and "kill the window when done" is the most common ending, exactly when a
# neighbor's ✅ needs acking.
# The helper is idempotent, so a double trigger just recomputes; if not deployed it skips
# quietly and never blocks tmux startup.
set-hook -g session-window-changed 'run-shell -b "if [ -x $HOME/.local/bin/tmux-pi-ack.py ]; then $HOME/.local/bin/tmux-pi-ack.py #{window_id}; fi"'
set-hook -g after-select-window 'run-shell -b "if [ -x $HOME/.local/bin/tmux-pi-ack.py ]; then $HOME/.local/bin/tmux-pi-ack.py #{window_id}; fi"'
set-hook -g after-select-pane 'run-shell -b "if [ -x $HOME/.local/bin/tmux-pi-ack.py ]; then $HOME/.local/bin/tmux-pi-ack.py #{window_id}; fi"'

# 状态栏点击不走上面三条 hook：tmux 把它派给 root 表的 MouseDown1Status（默认
# switch-client -t =），不触发 after-select-window。点当前 window 时窗口没变化，
# session-window-changed 也不发，单窗口下 ✅ 因此清不掉。故在默认切换动作前补一次 ack；
# 点不同 window 时与 session-window-changed 重复 ack 同一窗口，helper 幂等，无副作用。
bind -n MouseDown1Status 'run-shell -b "if [ -x $HOME/.local/bin/tmux-pi-ack.py ]; then $HOME/.local/bin/tmux-pi-ack.py #{window_id}; fi" ; switch-client -t ='

# Byobu's status-right ends with a per-second clock ($BYOBU_TIME defaults to %H:%M:%S):
# tmux redraws the right segment every second, and mosh 1.4.0's frame diffing leaves
# ghost digits there (two frames superimposed, e.g. "21:42:6234") — see mosh #1339/#370.
# This file is sourced AFTER byobu's stock profile (profiles/tmuxrc order), so setting
# status-right here simply wins; minute resolution redraws 60x less often. On a native
# (non-byobu) tmux this just gives a minimal right side: cwd's git branch or full path.
set -g status-right "#(byobu-status tmux_right)%Y-%m-%d %H:%M"
