# tmux / Byobu 配置 —— pi-kitmux 仓库为唯一事实源
#
# 部署（./scripts/deploy.sh）会建立两个软链指向本文件：
#   ~/.tmux.conf              -> <repo>/tmux.conf   原生 tmux 启动时直接读取
#   ~/.byobu/keybindings.tmux -> <repo>/tmux.conf   Byobu 启动时由 profiles/tmuxrc 第 35 行 source
# 改完重载：tmux source-file ~/.tmux.conf

set -g prefix ^B
set-window-option -g xterm-keys on
unbind-key -n C-a
unbind-key -n M-Left
unbind-key -n M-Right
unbind-key -n M-Up
unbind-key -n M-Down


set -g set-titles on
# set -g set-titles-string "#{pane_current_command}: #{b:pane_current_path}"
set -g set-titles-string "#{@pi_total}#{b:pane_current_path}"

set -g extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1

# set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"

set -as terminal-features ",xterm-kitty:RGB:usstyle"
set -ga terminal-overrides ",xterm-kitty:Tc"

set-environment -g COLORTERM "truecolor"
set -g allow-passthrough on

set -s extended-keys on
set -g mouse on
set -g history-limit 50000
set-window-option -g alternate-screen on

bind-key -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 2 scroll-down

bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down

bind-key v run-shell "open -a 'Visual Studio Code' '#{pane_current_path}'"

unbind-key p
bind-key p display-popup -w 85% -h 60% -E "/opt/homebrew/bin/python3 ~/.local/bin/switch-pi-agent.py"

set -g status-left-length 40
# 切换提示只在窗口少的时候显示，窗口一多就让位给 tab 栏
set -g status-left "[#S]#[fg=cyan]#{?#{e|>:#{session_windows},3},, [C-b 0-9:切Tab]}#[default] "

# byobu 底部 tab 栏 UI：
# - 每个 tab 是一枚独立「药丸」：非当前灰底、当前蓝底加粗，tab 之间用暗色 │ 分隔
# - 每个 tab 只显示本窗口有没有在跑 Pi agent（⏳，不带数字）
# - 窗口序号仅在 session 有多个窗口时才显示（单窗口 tab 没必要标注 1:）
# - 窗口名截断到 18 列，避免长名字把 tab 栏挤爆（应用名都很短，无需截断）
# - bell / activity 用彩色圆点（◉/●）代替默认的 ! / # 附加符号
# - enclave 只是沙盒 wrapper；状态栏从完整 `enclave run ...` 命令提取真实应用名
set -g window-status-style "bg=colour236,fg=colour250"
set -g window-status-current-style "bg=colour24,fg=colour231,bold"
set -g window-status-bell-style default
set -g window-status-activity-style default
# 分隔符必须显式清掉底色，否则会继承 window-status-style 的灰底，把整排药丸连成一条色带
set -g window-status-separator "#[bg=default,fg=colour240]│"

set -g window-status-format " #{?#{e|>:#{session_windows},1},#I: ,}#{?#{@pi_win},#[fg=yellow]#{@pi_win},}#[default]#{?pane_in_mode,#W,#{?#{==:#{pane_current_command},enclave},#($HOME/.local/bin/tmux-pane-command.py #{pane_pid} enclave),#{=/18/…:#{window_name}}}}#{?window_bell_flag,#[fg=red]◉,#{?window_activity_flag,#[fg=cyan]●,}} "
set -g window-status-current-format " #{?#{e|>:#{session_windows},1},#I: ,}#{?#{@pi_win},#[fg=yellow]#{@pi_win},}#[default]#{?pane_in_mode,#W,#{?#{==:#{pane_current_command},enclave},#($HOME/.local/bin/tmux-pane-command.py #{pane_pid} enclave),#{=/18/…:#{window_name}}}}#{?window_bell_flag,#[fg=red]◉,#{?window_activity_flag,#[fg=cyan]●,}} "
